# Perception source registry — copy to sources.yaml and edit.
# (docs/prd_perception_ingestion.md; setup.sh copies this automatically)
#
# Adding an information source = adding a block here. No new scripts.
# Adapter types live in sources/<type>.py and are discovered by dynamic
# import; bundled adapters: file_watch, git_repo, lark_chat, lark_mail,
# imap_mail, metrics_probe. Contract spec: sources/README.md.
# The bot works fine with no sources enabled — this whole layer is optional.

perception:
  defaults:
    sensitivity: internal
    interval: 15m

  sources:
    # Watch documents/reports for changes (first run baselines silently)
    - id: reports
      type: file_watch
      enabled: true
      label: "Docs and reports"
      collect:
        globs:
          - "~/path/to/your/workdir/*REPORT*.md"
          - "~/path/to/your/repos/your-jarvis/docs/*.md"
      schedule: { interval: 30m }
      perceive: { buffer: inbox_ops.md }

    # New commits across your local repos (read-only git log, no fetching)
    - id: repos_commits
      type: git_repo
      enabled: false
      label: "Local repos new commits"
      collect:
        repos_dir: "~/path/to/your/repos"
        exclude: ["your-jarvis-repo"]   # its commits come from your own sessions
      schedule: { interval: 30m }
      perceive: { buffer: inbox_ops.md }

    # A Lark group chat (find the chat id via: lark-cli im +chat-search --query 群名)
    - id: team_chat
      type: lark_chat
      enabled: false
      label: "Team group chat"
      collect:
        chat_id: "oc_XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX"
        exclude_open_id: "ou_YOUR_OWN_OPEN_ID"
      schedule: { interval: 10m }
      perceive: { buffer: inbox_team.md }

    # Lark mailbox new-mail metadata (from/subject only; bodies stay out of
    # context). The inbox_private_* buffer name keeps it away from
    # outward-facing tasks via the sensitivity gate.
    - id: lark_mail
      type: lark_mail
      enabled: false
      label: "Lark mailbox"
      collect:
        mailboxes: ["me"]
        exclude_from: ["dmarc", "mail-noreply@feishu.cn"]
      schedule: { interval: 15m }
      sensitivity: private
      perceive: { buffer: inbox_private_mail.md }

    # Generic IMAP-SSL mailbox (e.g. 163/Gmail/Outlook). Metadata only.
    # Credentials live in a 0600 JSON pointed to by secret_file — NEVER here:
    #   {"email":"you@163.com","imap_host":"imap.163.com","imap_port":993,
    #    "auth_code":"<app-password>"}
    # 163/Coremail needs an IMAP ID handshake (handled by the adapter).
    - id: imap_mail
      type: imap_mail
      enabled: false
      label: "IMAP mailbox"
      collect:
        secret_file: "~/path/to/imap_secret.json"
        # Explicit write opt-in: fetched mail is marked read only after the
        # server confirms the \Seen flag. Dry-runs never change mailbox state.
        mark_seen: false
        exclude_from: ["mailmaster@163.com", "newsletter"]
      schedule: { interval: 15m }
      sensitivity: private
      perceive: { buffer: inbox_private_mail.md }

    # Generic metrics probe: any command that prints {"metrics": {...}} JSON
    # (e.g. a script that queries YOUR product database or Grafana). Emits a
    # daily snapshot signal + threshold anomaly signals, and feeds the
    # metrics-digest heartbeat task (daily digest card + alert cards).
    # The command and any SQL/hosts it uses are YOUR infrastructure — keep
    # them here and in data/probes/ (both gitignored), never in tracked code.
    - id: product_metrics
      type: metrics_probe
      enabled: false
      label: "Product growth metrics"
      collect:
        name: product_growth
        command: "bash data/probes/product_metrics.sh"  # e.g. ssh your-host '...' or a psql wrapper
        timeout: 45
        snapshot_hour: 10      # daily snapshot on first collect at/after 10:00 local
        digest_hint: |
          Plain language for a non-analyst. Lead with new users + daily
          actives and the day-over-day change. One suggested action max.
        rules:                 # optional anomaly rules, checked every collect
          - { metric: new_today, op: "<=", value: 0, min_hour: 14 }
          - { metric: dau_yesterday, op: "<", pct_of_prev: 50 }
      schedule: { interval: 30m }
      perceive: { buffer: inbox_ops.md }
