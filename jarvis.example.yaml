# ═══════════════════════════════════════════════════════════════════
# Jarvis Harness Configuration
# ═══════════════════════════════════════════════════════════════════
# Copy this file to jarvis.yaml and edit the fields marked ⚙.
# Defaults below are safe for a fresh install — uncomment + change as needed.
#
#   cp jarvis.example.yaml jarvis.yaml
#
# All paths support ~ expansion. All fields are optional unless marked ⚙.
# ═══════════════════════════════════════════════════════════════════


# ── Data & Work Directories ────────────────────────────────────────

# Where Jarvis stores its runtime data (sessions, memory, heartbeat state).
# Defaults to ~/.jarvis. Must be writable.
data_dir: ~/.jarvis

# ⚙ Directory Claude operates in when responding to your messages.
# Claude's working-directory tool calls, file reads, git operations, etc.
# will all happen here. Common choices:
#   - Your current project folder (bot helps with that codebase)
#   - Your home dir (general-purpose assistant)
#   - The jarvis repo itself (bot can edit its own config)
# Leave empty to default to the jarvis repo directory.
work_dir: ""


# ── Lark (Feishu) IM Plugin ────────────────────────────────────────
# See plugins/lark/README.md for the full Lark app setup walkthrough.
# Leave the whole `lark:` section empty to run in heartbeat-only mode
# (no IM — everything else still works).

# 群聊等多人场景里助手对主人的称呼（可选，默认「主人」）
owner_name: ""

lark:
  # ⚙ Your Lark open_id (starts with "ou_"). Find it by sending any message
  # to your bot and checking jarvis.log for "sender_id".
  user_id: ""
  # ⚙ Your Lark app ID (starts with "cli_"). From your app at
  # https://open.feishu.cn/app
  app_id: ""


# ── Claude model settings ──────────────────────────────────────────

claude:
  # Main conversation model. Set an explicit model — do NOT leave empty.
  # An empty value makes every reply inherit the account's DEFAULT model,
  # which may be a model your account can't use (e.g. a banned/preview one),
  # silently breaking the bot. "opus" = Opus 4.8 (most capable).
  main_model: "opus"
  # Heartbeat background tasks use this. Default opus — max capability;
  # set a cheaper model here if you'd rather batch them down.
  heartbeat_model: "sonnet"   # cheaper default for new installs; "opus" = highest quality, noticeably higher cost
  # Auto-rotate Claude Code session files when they exceed this size (bytes).
  # 500KB is a good balance between context retention and API latency.
  max_session_size: 512000
  # Max seconds a single heartbeat Claude call may run. Raised from the old
  # hard-coded 300s so heartbeat tasks can fan out subagents (Task/Agent) and
  # wait for them. Higher = more room for parallel work, but one slow cycle
  # blocks other due tasks for longer. (Conversation replies use a separate
  # 6000s watchdog in bot.sh.)
  heartbeat_timeout: 600
  # Optional Claude Code-compatible backup provider. When primary Claude hits
  # a model/account/rate limit, main chat retries `claude -p` with these
  # ANTHROPIC_* values before using the text-only OpenAI fallback.
  backup_enabled: true
  backup_auth_token: ""
  backup_base_url: ""
  # Model ID for the backup provider. Leave empty to inherit main_model.
  # Use a pinned ID (e.g. "claude-opus-4-6") if the relay doesn't support
  # the latest model alias.
  backup_model: ""
  # Optional SECOND Claude relay. Same semantics as the primary backup, tried
  # after backup1 fails (e.g. a different billing account / provider).
  backup2_enabled: false
  backup2_auth_token: ""
  backup2_base_url: ""
  backup2_model: ""


# ── Codex CLI fallback settings ───────────────────────────────────
# Main owner-to-Jarvis Lark conversations can switch to the local Codex CLI
# after Claude-compatible routes fail. This reuses `codex login` / ChatGPT
# authentication; no API key is needed. Codex keeps one thread per Lark
# conversation. Group and non-owner conversations never receive this local
# tool-capable route.

codex:
  fallback_enabled: true
  fallback_model: "gpt-5.5"
  # Empty = auto-discover PATH, common install locations, or ChatGPT.app.
  binary: ""
  timeout: 300


# ── OpenAI fallback settings ───────────────────────────────────────
# Used only when the Claude-compatible and Codex CLI routes are exhausted.
# Requires OPENAI_API_KEY in the bot environment. Main-chat fallback is
# agentic: GPT can use the constrained bash/file_read/file_write tool loop.
# Heartbeat fallback remains text-only because heartbeat tasks have their own
# execution and post-processing lifecycle.

openai:
  fallback_enabled: true
  fallback_model: "gpt-5.5"
  # Prefer env var OPENAI_API_KEY for normal installs. This field exists for
  # private, gitignored deployments that keep provider keys in jarvis.yaml.
  api_key: ""
  base_url: "https://api.openai.com/v1"
  user_agent: ""
  timeout: 120
  max_output_tokens: 4096


# ── Memory System ──────────────────────────────────────────────────

memory:
  # Subdirectory under data_dir where memory .md files live.
  dir: memory
  # Minimum hourly entries before daily consolidation triggers.
  hourly_min_entries: 3
  # Minimum days in daily_log.md before weekly digest runs.
  daily_min_entries: 5
  # Minimum words in weekly digest before monthly archive compresses it.
  weekly_min_words: 200


# ── Heartbeat Loop ─────────────────────────────────────────────────

heartbeat:
  # How often to check for due tasks (seconds). Low is fine — empty cycles
  # return immediately.
  check_interval: 10
  # Task definitions file (relative to repo root).
  tasks_file: HEARTBEAT.md


# ── Admin Console ──────────────────────────────────────────────────
# Local web dashboard for browsing memory/sessions/search.
# Set enabled: true to have bot.sh auto-start it alongside the heartbeat.

admin:
  enabled: false
  host: "127.0.0.1"  # use "0.0.0.0" to expose externally — ALWAYS pair with token below
  port: 3456
  # Uncomment + set a random secret to require X-Admin-Token header.
  # REQUIRED if host is not 127.0.0.1.
  # token: "some-long-random-secret"


# ── Plugins ────────────────────────────────────────────────────────
# Each plugin is opt-in. Disabled plugins have zero overhead.

plugins:
  # EigenFlux — broadcast network for AI agents. See plugins/eigenflux/README.md
  # for account registration and setup.
  eigenflux:
    enabled: false         # set true after running the email verification flow
    persist_feed: true     # keep a local copy of every fetched item (for search)
    feed_db: eigenflux/feed_store.jsonl

# Optional: Phronesis group-chat monitor (tasks/phronesis_monitor_pre.sh).
# Leave unset to disable the task entirely.
phronesis:
  chat_id: ""          # oc_xxx — the group chat to monitor
  user_open_id: ""     # ou_xxx — whose mentions matter (defaults to lark.user_id)

# ── Geo & Weather (高德地图 Amap) ──────────────────────────────────
# Optional. Powers `python3 -m core.geo` (geocoding / POI / routing) and
# `python3 -m core.weather` (weather context injected into daily-plan /
# check-in / free-time prompts). Leave amap_key empty to disable everything —
# all geo/weather features silently no-op without a key.
# Get a free Web 服务 key at https://lbs.amap.com (控制台 → 应用管理).

geo:
  # ⚙ Amap Web 服务 API key. Env var AMAP_KEY overrides this.
  amap_key: ""
  # Fallback adcode for weather when no anchor below has one.
  # 310000 = 上海; find yours at https://lbs.amap.com/api/webservice/download
  default_adcode: "310000"
  # Named places ("anchors") for distance/routing questions. Runtime updates
  # (python3 -m core.geo anchor-set) go to data/geo_anchors.json (gitignored),
  # which OVERRIDES same-named entries here — this file is never rewritten.
  anchors: {}
  # anchors:
  #   home:
  #     address: "示例市示例区示例路1号"
  #     lat: 31.000000
  #     lng: 121.000000
  #     adcode: "310000"
  #   office:
  #     address: "示例市示例区示例大道100号"
  #     lat: 31.100000
  #     lng: 121.100000
  #     adcode: "310000"


# Optional: personal-website auto-updater (tasks/personal_site_pre.sh).
# Point at a LOCAL CLONE of your site repo (absolute path, ~ ok).
# Leave empty to disable the task and its health checks entirely.
personal_site:
  repo_dir: ""         # e.g. ~/projects/yourname.github.io
