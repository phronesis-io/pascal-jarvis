name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml pytest

      - name: Syntax check
        run: bash -n bot.sh

      - name: Run tests
        run: python -m pytest tests/ -v --ignore=tests/test_checkin_post.py
        # test_checkin_post.py requires lark-cli (not available in CI)
