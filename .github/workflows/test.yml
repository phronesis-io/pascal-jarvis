name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          # Keep the protected `test` check name while matching production.
          python-version: "3.14"
          cache: pip

      - name: Match production timezone
        run: |
          sudo ln -snf /usr/share/zoneinfo/Asia/Shanghai /etc/localtime
          echo Asia/Shanghai | sudo tee /etc/timezone

      - name: Install dependencies
        # requirements.txt (not a hand-picked subset) — a missing runtime dep
        # makes its test module silently skip and broken PRs merge green.
        run: |
          pip install -r requirements-dev.txt
          pip install --no-deps 'https://github.com/phronesis-io/eigenflux-sdk-distribution/releases/download/v0.1.2/eigenflux_sdk-0.1.2-py3-none-manylinux_2_17_x86_64.whl#sha256=94f364e0043376314720f6aafd00f3ee90ab31cf2e70b1939cb07265b9d86372'
          python -c "import eigenflux_sdk; from importlib.metadata import version; assert version('eigenflux-sdk') == '0.1.2'"

      - name: Shell syntax
        run: |
          bash -n bot.sh
          bash -n restart.sh
          find tasks scripts -type f -name '*.sh' -exec bash -n {} +

      - name: ShellCheck (catches runtime bash bugs)
        run: |
          sudo apt-get install -y shellcheck
          shellcheck -s bash -S error -e SC1090,SC1091 bot.sh
          shellcheck -s bash -S error -e SC1090,SC1091 restart.sh
          find tasks/ -name '*.sh' -not -path 'tasks/_quarantine/*' -exec shellcheck -s bash -S error -e SC1090,SC1091 {} +
          find scripts/ -name '*.sh' -exec shellcheck -s bash -S error -e SC1090,SC1091 {} +

      - name: Maintainability debt budget
        run: python scripts/maintainability_budget.py

      - name: Run tests
        env:
          # Parallel subprocess coverage must never write instrumentation
          # artifacts into the checked-out runtime tree: the strict test guard
          # correctly treats that as repository-state mutation.
          COVERAGE_FILE: ${{ runner.temp }}/jarvis-coverage
        run: |
          python -m coverage run -m pytest tests/ -v
          python -m coverage combine
          python -m coverage json -o /tmp/jarvis-coverage.json
          python scripts/coverage_budget.py /tmp/jarvis-coverage.json

  python-312-compat:
    name: Python 3.12 compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Match production timezone
        run: |
          sudo ln -snf /usr/share/zoneinfo/Asia/Shanghai /etc/localtime
          echo Asia/Shanghai | sudo tee /etc/timezone

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip install --no-deps 'https://github.com/phronesis-io/eigenflux-sdk-distribution/releases/download/v0.1.2/eigenflux_sdk-0.1.2-py3-none-manylinux_2_17_x86_64.whl#sha256=94f364e0043376314720f6aafd00f3ee90ab31cf2e70b1939cb07265b9d86372'
          python -c "import eigenflux_sdk; from importlib.metadata import version; assert version('eigenflux-sdk') == '0.1.2'"

      - name: Run compatibility tests
        run: python -m pytest tests/
