name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        # requirements.txt (not a hand-picked subset) — a missing runtime dep
        # makes its test module silently skip and broken PRs merge green.
        run: pip install -r requirements-dev.txt

      - name: Shell syntax
        run: |
          bash -n bot.sh
          bash -n restart.sh
          find tasks scripts -type f -name '*.sh' -exec bash -n {} +

      - name: ShellCheck (catches runtime bash bugs)
        run: |
          sudo apt-get install -y shellcheck
          shellcheck -s bash -S error -e SC1090,SC1091 bot.sh
          shellcheck -s bash -S error -e SC1090,SC1091 restart.sh
          find tasks/ -name '*.sh' -not -path 'tasks/_quarantine/*' -exec shellcheck -s bash -S error -e SC1090,SC1091 {} +
          find scripts/ -name '*.sh' -exec shellcheck -s bash -S error -e SC1090,SC1091 {} +

      - name: Maintainability debt budget
        run: python scripts/maintainability_budget.py

      - name: Run tests
        run: |
          python -m coverage run -m pytest tests/ -v
          python -m coverage combine
          python -m coverage json -o /tmp/jarvis-coverage.json
          python scripts/coverage_budget.py /tmp/jarvis-coverage.json
