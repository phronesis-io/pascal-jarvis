name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        # requirements.txt (not a hand-picked subset) — otherwise the dashboard
        # suite silently skips and broken dashboard PRs merge green.
        run: pip install -r requirements.txt pytest

      - name: Syntax check
        run: bash -n bot.sh

      - name: ShellCheck (catches runtime bash bugs)
        run: |
          sudo apt-get install -y shellcheck
          shellcheck -s bash -S error -e SC1090,SC1091 bot.sh

      - name: Run tests
        run: python -m pytest tests/ -v
