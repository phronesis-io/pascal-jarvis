# components.yaml — single source of truth for "what should be running" (REQ-40).
#
# The dashboard died for 23 days because four supervision surfaces (daemon,
# doctor.sh, restart.sh --status, self-diagnostic) each kept their own
# hardcoded component list and none included :3457. This manifest is consumed
# by ALL of them via core/components.py — a component not listed here does
# not exist; a component listed here cannot die silently. (The :3457
# dashboard itself is retired as of 2026-08-21; the lesson that created this
# manifest outlives the component.)
#
# check types:
#   pid       — pidfile alive (first whitespace field, kill -0)
#   pgrep     — process matching `pattern` exists
#   http      — GET `url` answers < 5s with status < 500
#   file_age  — `path` mtime younger than `max_age_hours`
#   launchctl — `label` loaded in the gui domain
#   taskline  — CLI reports both server healthy and workspace registered
#   heartbeat_tasks — heartbeat TASKS are succeeding, not merely the process
#               being alive (reuses the daemon's brain_health.assess verdict)
#   delivery  — recent envelopes include real provider receipts rather than a
#               streak of terminal failures or an overdue retry queue
#   model_runtime — shared model call receipts are complete, not stale, and do
#               not show an unresolved write-side ambiguity or failure streak
#
# critical: true → daemon.py checks it every 30s (alert-only for components
# it does not own; daemon only ever restarts bot.sh). Everything is checked
# by self-diagnostic every 4h, doctor.sh at install, restart.sh --status on
# demand.
#
# Optional-feature gates (2026-07-13, collaborator fresh-install audit):
# a component whose requires_cmd / requires_file / requires_config
# precondition is unmet is SKIPPED (reported "○ skipped", never ⚠️/critical).
# doctor.sh calls Lark/EigenFlux/admin/launchd optional — this manifest must
# agree, or every default install alarms forever on features it never enabled.

components:
  - name: taskline
    check: taskline
    critical: false
    requires_file: ../taskline/dist/taskline-server

  - name: daemon
    check: pid
    path: .daemon.pid
    critical: false          # daemon can't check itself; launchd owns it
    requires_file: ~/Library/LaunchAgents/com.pascal.jarvis.daemon.plist
    note: launchd KeepAlive com.pascal.jarvis.daemon (scripts/launchd/install.sh)

  - name: bot
    check: pid
    path: .bot.pid
    critical: true
    note: main Lark loop; daemon restarts it

  - name: heartbeat-loop
    check: pgrep
    pattern: "core.heartbeat_loop"
    owned_by_pidfile: .bot.pid
    critical: true
    note: resident scheduler inside bot.sh; bot watchdog restarts it, Guardian may request an exact owned-child recycle before paging

  - name: heartbeat-tasks
    check: heartbeat_tasks
    path: heartbeat_state.json
    critical: false          # daemon's brain-health path is the pager; this
                             # entry exists so doctor.sh / restart.sh --status
                             # / self-diagnostic / `python3 -m core.components`
                             # can no longer read all-green through a stall
    requires_file: heartbeat_state.json
    note: |
      Process liveness is not task health. 2026-07-27 05:58-09:59: the loop was
      alive (pgrep green) while activity-log failed every run, intention-check
      was wedged 11h, and memory-tidy/self-diagnostic had gone 16h/15h without
      a success — this manifest reported 15/15 healthy throughout. Same verdict
      the daemon pages on; honors the same post-wake grace; never writes state.

  - name: unified-delivery
    check: delivery
    path: data/jarvis.db
    window_seconds: 3600
    failure_streak: 3
    max_overdue_seconds: 900
    critical: false
    requires_file: data/jarvis.db
    note: >-
      Process and HTTP health do not prove that Pascal receives anything. A
      recent streak of failed envelopes, or an overdue retry queue, makes the
      product unhealthy even while bot/admin remain alive. The
      daemon's independent dead-letter path owns paging; this check is
      observation-only and must not create a credential restart loop.

  - name: model-runtime
    check: model_runtime
    path: data/jarvis.db
    window_seconds: 3600
    failure_streak: 3
    stale_after_seconds: 1800
    integrity_window_seconds: 86400
    critical: false
    requires_file: data/jarvis.db
    note: >-
      Provider-neutral execution receipts. Observation-only: a stalled call,
      broken receipt, repeated recent failures, or recent ambiguous write/external
      effect is visible to operators without triggering a restart loop.

  - name: ef-stream
    check: ef_stream
    pattern: "core.ef_stream_loop"
    path: data/ef_stream_health.json
    max_age_seconds: 2400
    reconcile_path: data/ef_ingress_health.json
    reconcile_max_age_seconds: 900
    connect_grace_seconds: 600
    owned_by_pidfile: .bot.pid
    critical: true
    requires_cmd: eigenflux
    note: EigenFlux PM/friend stream; verifies protocol state as well as process ownership

  - name: lark-sidecar
    check: pgrep
    pattern: "lark_event_sidecar.py"
    owned_by_pidfile: .bot.pid
    critical: true
    requires_config: lark.event_backend=sidecar
    note: card callbacks + read receipts die silently without it

  - name: admin
    check: http
    url: "http://127.0.0.1:3456/health"
    critical: true
    requires_config: admin.enabled
    note: ops console + Lark RichView links; bot watchdog restarts it, Guardian verifies recovery before paging

  - name: daemon-launchd
    check: launchctl
    label: com.pascal.jarvis.daemon
    critical: false
    requires_file: ~/Library/LaunchAgents/com.pascal.jarvis.daemon.plist

  - name: external-deadman
    check: deadman
    critical: false
    requires_config: ops.deadman.enabled
    note: external missed-ping service catches whole-machine/FileVault outages

  - name: caffeinate-launchd
    check: launchctl
    label: com.pascal.jarvis.caffeinate
    critical: false
    requires_file: ~/Library/LaunchAgents/com.pascal.jarvis.caffeinate.plist
    note: caffeinate -s keeps the Mac awake on AC only (REQ-56, 电池策略不动) — sleeping on battery is not this component failing

  - name: session-backup
    check: file_age
    path: .last_backup_ok
    max_age_hours: 48
    critical: false
    requires_file: ~/Library/LaunchAgents/com.jarvis.session-backup.plist
    note: backup silently failed for 27 days before this check existed (REQ-41)

  - name: conversation-audit
    check: audit_age
    path: data/conversation_audit.db
    max_age_hours: 48
    critical: false
    requires_file: ~/Library/LaunchAgents/com.jarvis.conversation-audit.plist
    note: latest completed audit must stay fresh; launchd com.jarvis.conversation-audit runs daily at 04:20

  - name: companion-voice
    check: file_age
    path: data/companion_last_spoke
    max_age_hours: 48
    critical: false
    requires_file: data/companion_last_spoke
    note: >-
      checkin 是产品本身，不是 36 个任务里的一个。2026-08-02 发现它整整 10 天
      一句话没说（上一张卡 7/23），而任务状态一路 last_status=ok、708 次运行全绿：
      沉默从来没有被当成一个状态。core.companion 每次真发出卡片就 touch 这个文件，
      所以「不说话」现在会像别的组件死掉一样亮红。requires_file 让它在从没开口过的
      全新安装上跳过，而不是对着一个还不存在的文件报警。
